<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SongList Leader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">Leader</p>
          <h1>Song control</h1>
          <p class="muted">Selecting a song updates all connected user screens.</p>
        </div>
        <label class="field">
          <span>Song</span>
          <select id="song-select"></select>
        </label>
        <div class="status-panel">
          <div><span>Leaders</span><strong id="leader-count">0</strong></div>
          <div><span>Users</span><strong id="user-count">0</strong></div>
        </div>
        <a class="text-link" href="/user.html">Open the user view</a>
      </aside>
      <main class="song-stage">
        <header class="song-header">
          <div>
            <p class="eyebrow">Now Showing</p>
            <h2 id="song-title">Loading...</h2>
          </div>
        </header>
        <section id="song-content" class="song-content leader-content"></section>
      </main>
    </div>
    <script src="/leader.js" defer></script>
  </body>
</html>
