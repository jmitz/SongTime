<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SongList User</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell user-shell">
      <main class="song-stage">
        <header class="song-header">
          <div>
            <h1 id="song-title">Loading...</h1>
            <p id="song-meta" class="song-meta"></p>
            <p id="section-label" class="section-label" hidden></p>
          </div>
          <div class="user-toolbar">
            <div class="user-menu-shell">
              <button
                id="open-user-menu-button"
                class="button button-secondary user-menu-button"
                type="button"
                aria-expanded="false"
                aria-controls="user-menu-panel"
                aria-label="Open audience options"
              >
                <span class="user-menu-button-lines" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                </span>
              </button>
              <div id="user-menu-panel" class="user-menu-panel" hidden>
                <button id="open-pick-panel-button" class="pill pill-button" type="button">Pick songs</button>
                <label class="toggle">
                  <input id="show-chords" type="checkbox" />
                  <span>Show chords</span>
                </label>
              </div>
            </div>
            <div class="pill" id="connection-status">Connecting...</div>
          </div>
        </header>
        <section id="song-content" class="song-content user-content"></section>
        <aside id="user-pick-panel" class="user-pick-panel" hidden>
          <div class="user-pick-panel-header">
            <div>
              <p class="eyebrow">Audience Picks</p>
              <h2>Suggest a song</h2>
              <p class="muted">Only songs ready for the audience view can be added to the current set list.</p>
            </div>
            <button
              id="close-pick-panel-button"
              class="setlist-close-button"
              type="button"
              aria-label="Close song pick dialog"
            >
              ×
            </button>
          </div>
          <label class="field">
            <span>Search songs</span>
            <input id="pick-song-search" type="search" placeholder="Filter by title or author" />
          </label>
          <div id="pick-panel-status" class="pill">Loading songs...</div>
          <div id="pick-song-list" class="user-pick-list" aria-live="polite"></div>
        </aside>
      </main>
    </div>
    <script src="/song-render.js" defer></script>
    <script src="/user.js" defer></script>
  </body>
</html>
